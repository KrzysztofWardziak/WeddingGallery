<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <!-- Two interlocking wedding bands. The tab title already carries "K & K", so the icon
       carries the occasion instead of repeating the initials.

       Sized for 16 px first: at that scale the 7-unit stroke lands on roughly 1.75 px, which
       stays visible, and everything finer than that was dropped. The width/height attributes
       exist so librsvg rasterises at 512 px for the PNG derivatives rather than at the
       64-unit viewBox and then upscaling.

       Palette from tailwind.config.js: navy #1a2e45, gold #d4af37, brass #b89947. The navy
       plate is deliberate - it holds contrast against both a light and a dark browser tab. -->
  <rect width="64" height="64" rx="12" fill="#1a2e45"/>
  <g fill="none" stroke-width="7">
    <circle cx="22" cy="32" r="15" stroke="#d4af37"/>
    <circle cx="42" cy="32" r="15" stroke="#b89947"/>
    <!-- The left band redrawn across the crossing so it passes in front of the right one.
         Invisible at 16 px, but it is what makes the pair read as woven at 180 px. -->
    <path d="M32 20.82A15 15 0 0 1 32 43.18" stroke="#d4af37"/>
  </g>
</svg>
