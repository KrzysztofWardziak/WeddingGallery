<div class="flex flex-col items-center justify-between min-h-screen p-8 text-center">

  <div *ngIf="isLoading" class="flex-1 flex items-center justify-center">
    <p class="text-navy-blue">Ładowanie wydarzenia...</p>
  </div>

  <div *ngIf="hasError" class="flex-1 flex items-center justify-center">
    <p class="text-red-500">Nie znaleziono wydarzenia. Sprawdź link.</p>
  </div>

  <ng-container *ngIf="!isLoading && !hasError">
    <!-- Top Header -->
    <div class="mt-12">
      <h1 class="text-3xl tracking-widest font-serif text-navy-blue mb-2">MEMORIES</h1>
      <p class="text-sm tracking-widest text-navy-blue/70 font-light">{{ eventName | uppercase }}</p>
    </div>

    <!-- Center Icon -->
    <div class="flex-1 flex flex-col items-center justify-center w-full">
      <div
        class="w-48 h-48 border border-navy-blue/30 rounded-full flex items-center justify-center bg-white/50 shadow-sm">
        <svg class="w-16 h-16 text-navy-blue/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        </svg>
      </div>
    </div>

    <!-- Bottom Action -->
    <div class="w-full max-w-sm mb-8 space-y-4">
      <a routerLink="/pick" class="btn-primary block">📷 Dodaj Zdjęcia</a>
      <a routerLink="/feed" class="block text-center py-3 px-6 border border-navy-blue/30 rounded-full text-navy-blue font-light tracking-widest text-sm hover:bg-navy-blue/5 transition-colors">
        🖼️ Przeglądaj Galerię
      </a>
      <p class="text-sm text-navy-blue/80 font-light">Udostępnij chwile, bez logowania.</p>
    </div>
  </ng-container>

</div>
