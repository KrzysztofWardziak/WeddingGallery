<div class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
  <div class="w-full max-w-md bg-white/60 p-8 rounded-xl shadow-sm border border-white">
    <h2 class="text-2xl font-light text-navy-blue mb-2">Panel Administratora</h2>
    <p class="text-navy-blue/70 mb-8 font-light text-sm">Stwórz nowe wydarzenie</p>
    
    <input type="text" [(ngModel)]="eventName" placeholder="Nazwa wydarzenia (np. Ania i Tomek)"
           class="w-full px-4 py-3 mb-4 bg-white/60 border border-white rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-teal-primary text-navy-blue placeholder-navy-blue/40">

    <label class="block text-left text-xs text-navy-blue/60 mb-1 px-1">Data wydarzenia (nieobowiązkowa)</label>
    <input type="date" [(ngModel)]="eventDate"
           class="w-full px-4 py-3 mb-4 bg-white/60 border border-white rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-teal-primary text-navy-blue">
           
    <button (click)="createEvent()" [disabled]="!eventName || isLoading"
            class="btn-primary w-full disabled:opacity-50">
      {{ isLoading ? 'Tworzenie...' : 'Rozpocznij Wydarzenie' }}
    </button>
  </div>
</div>
