<div class="flex flex-col min-h-screen p-6 pb-24">

  <!-- Header -->
  <div class="mb-6 text-center">
    <h2 class="text-2xl font-light text-navy-blue tracking-wide">Wybierz Zdjęcia</h2>
  </div>

  <!-- Name Input -->
  <div class="mb-8">
    <input type="text" [(ngModel)]="guestName" placeholder="Twoje Imię/Pseudonim"
           class="w-full px-4 py-3 text-lg bg-white/60 border border-white rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-teal-primary text-navy-blue placeholder-navy-blue/40">
  </div>

  <input type="file" multiple accept="image/*" #fileInput (change)="onFilesSelected($event)" class="hidden">

  <!-- Image Grid -->
  <div class="grid grid-cols-3 gap-2 flex-1 content-start mb-8">
    
    <div *ngFor="let url of previewUrls; let i = index" class="aspect-square bg-white/40 border-[1.5px] border-teal-primary relative">
      <img [src]="url" class="w-full h-full object-cover">
      <button (click)="removeFile(i)" class="absolute top-1 right-1 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center text-white text-xs shadow">
        &times;
      </button>
    </div>
    
    <!-- Add More Placeholder -->
    <div (click)="triggerFileInput()" class="aspect-square bg-white/40 border-2 border-dashed border-teal-primary/40 flex flex-col items-center justify-center cursor-pointer hover:bg-white/60">
      <span class="text-teal-primary text-2xl font-light">+</span>
    </div>
  </div>

  <!-- Bottom Actions Fixed -->
  <div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-dusty-teal via-dusty-teal to-transparent space-y-3">
    <button (click)="uploadFiles()" [disabled]="selectedFiles.length === 0 || !guestName || isUploading"
            class="btn-primary w-full disabled:opacity-50">
      {{ isUploading ? 'Wysyłanie...' : 'Wyślij ' + selectedFiles.length + ' Zdjęć' }}
    </button>
  </div>

</div>
