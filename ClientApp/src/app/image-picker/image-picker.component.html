<div class="flex flex-col min-h-screen p-6 pb-24">

  <!-- Header -->
  <div class="mb-6 text-center">
    <h2 class="text-2xl font-light text-navy-blue tracking-wide">Wybierz Zdjęcia</h2>
  </div>

  <!-- Name Input -->
  <div class="mb-8">
    <input type="text" placeholder="Twoje Imię/Pseudonim"
           class="w-full px-4 py-3 bg-white/60 border border-white rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-teal-primary text-navy-blue placeholder-navy-blue/40">
  </div>

  <!-- Image Grid (Placeholder) -->
  <div class="grid grid-cols-3 gap-2 flex-1 content-start mb-8">
    <!-- Selected Item -->
    <div class="aspect-square bg-white/40 border-[1.5px] border-teal-primary relative">
      <div class="absolute top-1 right-1 w-5 h-5 bg-teal-primary rounded-full flex items-center justify-center text-white text-xs">1</div>
    </div>
    <!-- Unselected Items -->
    <div class="aspect-square bg-white/40"></div>
    <div class="aspect-square bg-white/40"></div>
    <div class="aspect-square bg-white/40"></div>
    <div class="aspect-square bg-white/40"></div>
    <div class="aspect-square bg-white/40"></div>
  </div>

  <!-- Bottom Actions Fixed -->
  <div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-dusty-teal via-dusty-teal to-transparent space-y-3">
    <a routerLink="/uploading" class="btn-primary block">Wyślij 1 Zdjęcie</a>
    <button class="btn-secondary block">Zrób Nowe Zdjęcie</button>
  </div>

</div>
