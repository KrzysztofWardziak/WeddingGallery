<div class="flex flex-col min-h-screen pb-16">

  <!-- Header -->
  <div class="pt-10 pb-4 text-center">
    <h2 class="text-xl font-medium tracking-widest text-navy-blue">DZIĘKUJEMY!</h2>
    <p class="text-xs text-navy-blue/60 mt-1">Galeria aktualizuje się na żywo</p>
  </div>

  <!-- Search Bar -->
  <div class="px-4 pb-4">
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-navy-blue/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"></path>
      </svg>
      <input type="search" [(ngModel)]="searchTerm" placeholder="Szukaj zdjęć gościa..."
             class="w-full pl-10 pr-4 py-2.5 bg-white/60 border border-white rounded-full text-sm text-navy-blue placeholder-navy-blue/40 focus:outline-none focus:ring-1 focus:ring-teal-primary shadow-sm">
    </div>
    <p *ngIf="searchTerm" class="text-xs text-navy-blue/50 mt-2 text-center">
      Znaleziono: {{ filteredPhotos.length }} z {{ photos.length }} zdjęć
    </p>
  </div>

  <!-- Masonry Grid -->
  <div class="flex-1 px-2 columns-2 gap-2 space-y-2">
    
    <div *ngFor="let photo of filteredPhotos; let i = index" class="relative break-inside-avoid bg-white/40 mb-2 cursor-pointer" (click)="openPhoto(i)">
      <img [src]="imagesUrl + photo.url" class="w-full h-auto object-cover rounded shadow-sm" alt="Zdjęcie gościa">
      
      <div class="absolute bottom-2 left-2 bg-white/90 px-2 py-1 rounded text-[10px] text-brass font-medium shadow-sm">
        {{ photo.uploaderName }}
      </div>
    </div>

  </div>

  <div *ngIf="filteredPhotos.length === 0 && photos.length > 0" class="text-center text-navy-blue/50 py-10 text-sm">
    Brak zdjęć pasujących do wyszukiwania.
  </div>

  <div *ngIf="photos.length === 0" class="text-center text-navy-blue/50 py-10 text-sm">
    Bądź pierwszym, który udostępni zdjęcie!
  </div>

  <!-- Fullscreen Lightbox Overlay -->
  <div *ngIf="selectedPhotoUrl" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center backdrop-blur-sm" (click)="closePhoto()">
    <button class="absolute top-6 right-6 text-white bg-black/50 rounded-full w-10 h-10 flex items-center justify-center z-50" (click)="closePhoto()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    
    <!-- Left Arrow -->
    <button *ngIf="selectedIndex !== null && selectedIndex > 0" 
            class="absolute left-4 text-white bg-black/50 rounded-full w-10 h-10 flex items-center justify-center z-50" 
            (click)="prevPhoto($event)">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
    </button>

    <img [src]="selectedPhotoUrl" class="max-w-full max-h-full object-contain p-4" (click)="$event.stopPropagation()">

    <!-- Right Arrow -->
    <button *ngIf="selectedIndex !== null && selectedIndex < filteredPhotos.length - 1" 
            class="absolute right-4 text-white bg-black/50 rounded-full w-10 h-10 flex items-center justify-center z-50" 
            (click)="nextPhoto($event)">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </button>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="fixed bottom-0 left-0 right-0 h-16 bg-navy-blue flex justify-around items-center px-6">
    <a routerLink="/feed" class="flex flex-col items-center justify-center text-gold transition-colors">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
      </svg>
      <span class="text-[10px] font-medium tracking-wide">Galeria</span>
    </a>
    
    <a routerLink="/pick" class="flex flex-col items-center justify-center text-brass/70 hover:text-gold transition-colors">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4" />
      </svg>
      <span class="text-[10px] font-medium tracking-wide">Dodaj</span>
    </a>
  </div>

</div>
