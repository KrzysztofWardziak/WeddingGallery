<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>K &amp; K</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <!-- Guests reach the gallery from a QR code and often add it to their home screen;
       this is the label that ends up under the icon on iOS. -->
  <meta name="apple-mobile-web-app-title" content="K &amp; K">
  <meta name="application-name" content="K &amp; K">
  <!-- .ico first with an explicit size, .svg second: browsers that understand the vector
       prefer it and stay crisp at any zoom, the rest fall back to the raster. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Tints the browser chrome on Android to match the icon plate and the bottom nav bar. -->
  <meta name="theme-color" content="#1a2e45">
</head>

</body>
</html>
