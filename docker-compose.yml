version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wedding_gallery
      POSTGRES_USER: wedding_user
      POSTGRES_PASSWORD: wedding_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding_user -d wedding_gallery"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: WeddingGallery.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=wedding_gallery;Username=wedding_user;Password=wedding_password
      - ASPNETCORE_ENVIRONMENT=Development
      - AdminSettings__Password=admin
      - AdminSettings__Token=secret-admin-token-12345
    ports:
      - "5205:8080"
    volumes:
      - photo_storage:/app/photos
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata:
  photo_storage:
